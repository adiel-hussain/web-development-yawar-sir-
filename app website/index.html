<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
</head>

<body>
    <header>
        <div class="header">
            <div class="img1">
                <img src="speedykartlogo.webp" alt="speedykart logo">
                <h1>SpeedyKart</h1>
            </div>
            <div>

            </div>
            <div class="searchbar">
                <input type="text" value="" placeholder="searchicon">
                <button><i class="fa-solid fa-magnifying-glass"></i></button>

            </div>
            <div>

            </div>
            <div class="icons">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-brands fa-shopify"></i>

            </div>
            <div class="bars">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
        <nav class="navbar">
            <a href="#">HOME</a>
            <a href="#">HOT BOX</a>
            <a href="#">SPEEDY MART</a>
            <a href="#">ABOUT US</a>
        </nav>
        <div class="background-image">

        </div>
        <div class="box">
            <div class="boxes box1">
                <i class="fa-regular fa-truck"></i>
                <div class="text-1">
                    <h1>Free Shipping</h1>
                    <p>On all servives</p>
                </div>
            </div>
            <div class="boxes box2">
                <i class="fa-solid fa-wallet"></i>
                <div class="text-1">
                    <h1>Secure Payments</h1>
                    <p>100% secure</p>
                </div>
            </div>
            <div class="boxes box3">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                <div class="text-1">
                    <h1>Easy Returns</h1>
                    <p>7 days return </p>
                </div>
            </div>
            <div class="boxes box4">
                <i class="fa-solid fa-people-roof"></i>
                <div class="text-1">
                    <h1>24\7 Support</h1>
                    <p>Always here</p>
                </div>
            </div>
        </div>
        <div class="top-products">
            <div class="products-header">
                <div>
                    <h1>Features Products</h1>
                </div>
                <div>
                    <a href="#">View All</a>
                </div>

            </div>
            <div class="product-boxes">
                <div class="product-box box1">
                    <div class="box-image" style="background-image: url(shoe\ image.jpeg);"></div>
                    
                </div>
                <div class="product-box box2">2</div>
                <div class="product-box box3">3</div>
                <div class="product-box box4">4</div>
            </div>
        </div>
    </header>


</body>

</html>
