<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPEEDY KART - Home</title>
    <link rel="stylesheet" href="styling.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            <img src="image folder/speedykartlogo.webp" alt="speedy kart">
            <h2>SPEEDY KART</h2>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="search for products">
            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div class="header-buttons">
            <button>
                <i class="fa-regular fa-heart"></i>
            </button>
            <button>
                <i class="fa-solid fa-dolly"></i>
            </button>
            <button>
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
        </div>
    </header>
    <nav>
        <div class="nav-bar">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Categories</a>
            <a href="#">Contacts</a>
        </div>
    </nav>

    <body>
        <div class="body-features">
            <div class="about">
            <div class="about-features">
                <div class="text">
                    <h2>
                        Discover Trendy Products For a better You
                    </h2>
                    <p>
                        latest collections best prices and amazing offers only on speedykart
                    </p>
                </div>
            </div>
            <div class="shopping-image">
                <img src="image folder/shopping images.jpeg" alt="shopping image">
            </div>
            </div>
        </div>
        <div class="features-product">
            <div class="features-heading">
                <div class="heading">
                <h2>Features Products</h2>
                </div>
                <div class="view">
                    <button>
                        viewall
                    </button>
                </div>
            </div>
            <div class="products">
                <div class="boxes"></div>
                <div class="boxes"></div>
                <div class="boxes"></div>
                <div class="boxes"></div>
            </div>
        </div>
    </body>
</body>
