<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="modal-background">
    <div class="product-modal">
        <button class="close-button">&times;</button>
        <div class="product-images">
            <div class="main-image">
                <img src="modal-shoe3.jpeg"
                     alt="Sneakers">
            </div>
            <div class="thumbnail-images">
                <img src="modal-shoe1.jpeg" alt="">
                <img src="modal-shoe2.jpeg" alt="">
                <img src="modal-shoe3.jpeg" alt="">
            </div>
        </div>
        <div class="product-info">
            <h2>Casual Sneakers</h2>
            <div class="rating">
                <span>★★★★☆</span>
                <small>4.5 (120 reviews)</small>
            </div>
            <div class="price">
                <strong>₹1,299</strong>
                <del>₹1,999</del>
                <span class="discount">35% OFF</span>
            </div>
            <p class="description">
                Comfortable and stylish sneakers for everyday wear.
                Made with high-quality materials for long-lasting durability.
            </p>
            <div class="color-section">
                <h4>Color:</h4>
                <div class="colors">
                    <button class="color white"></button>
                    <button class="color black"></button>
                    <button class="color grey"></button>
                </div>
            </div>
            <div class="size-section">
                <h4>Size:</h4>
                <div class="sizes">
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                </div>
            </div>
            <div class="quantity-section">
                <h4>Quantity:</h4>
                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
            </div>
            <button class="cart-button">Add to Cart</button>
            <button class="wishlist-button">
                 &nbsp; Add to Wishlist
            </button>
        </div>
    </div>
</div>
</body>
</html>
